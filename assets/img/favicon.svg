<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0a0f17"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(201, 199, 240, 0.2)" stroke-width="1.5"/>
  <!-- Signature 4-dot grid -->
  <rect x="14" y="14" width="6" height="6" rx="1.5" fill="#2FA99A"/>
  <rect x="22" y="14" width="6" height="6" rx="1.5" fill="#A3E4D9"/>
  <rect x="14" y="22" width="6" height="6" rx="1.5" fill="#c9c7f0"/>
  <rect x="22" y="22" width="6" height="6" rx="1.5" fill="#2FA99A"/>
  <!-- NF Monogram -->
  <text x="34" y="38" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f3f2fb" letter-spacing="-1">NF</text>
  <!-- Data pulse accent line -->
  <line x1="14" y1="48" x2="50" y2="48" stroke="#2FA99A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="48" r="2" fill="#A3E4D9"/>
</svg>
